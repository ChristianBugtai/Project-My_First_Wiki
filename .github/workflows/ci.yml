name: Node.js CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v2

            - name: Use Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "18"

            - name: Install Dependencies
              run: npm install

            - name: Run Tests
              run: npm test

            # - name: Deploy to Firebase
            #   if: github.ref == 'refs/heads/main'
            #   run: npx firebase-tools deploy --token "${{ secrets.FIREBASE_KEY }}"
